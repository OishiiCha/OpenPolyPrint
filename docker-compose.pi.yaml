services:
    openpolyprint:
        image: ghcr.io/lucas/openpolyprint:latest-pi
        container_name: openpolyprint
        restart: always
        build:
            context: .
            dockerfile: Dockerfile.pi

        # host-mode networking is required for pppp communication with the printer
        network_mode: host

        environment:
            - OPENPOLYPRINT_HOST=0.0.0.0
            - OPENPOLYPRINT_PORT=8080
            - OPENPOLYPRINT_DATA_DIR=/data

        # Pi camera (libcamera/rpicam) + USB camera + GPIO access:
        # - /dev:/dev gives the container the full host device tree (includes
        #   /dev/gpiomem and /dev/gpiochip0 for GPIO access)
        # - /run/udev (read-only) is the udev database libcamera uses
        # - /sys/class/gpio and /sys/devices/platform/soc allow sysfs GPIO access
        volumes:
            - openpolyprint_data:/data
            - /dev:/dev
            - /run/udev:/run/udev:ro
            - /sys/class/gpio:/sys/class/gpio
            - /sys/devices/platform/soc:/sys/devices/platform/soc
        device_cgroup_rules:
            - "c 81:* rmw"
            - "c 189:* rmw"
            - "c 29:* rmw"
            - "c 226:* rmw"
            - "c 254:* rmw"
        privileged: true

        command: ["-addr", "0.0.0.0:8080"]

    # Nginx Proxy Manager — provides HTTPS termination and reverse proxy
    # Admin UI is at http://<host>:81 (default login: admin@example.com / changeme)
    # Configure a proxy host: domain → host.docker.internal:8080
    nginx-proxy-manager:
        image: jc21/nginx-proxy-manager:latest
        container_name: nginx-proxy-manager
        restart: unless-stopped
        ports:
            - '80:80'     # Public HTTP port for routing/challenges
            - '443:443'   # Public HTTPS port for secure local traffic
            - '81:81'     # Admin Web UI port
        volumes:
            - npm_data:/data
            - npm_letsencrypt:/etc/letsencrypt
        # Allow NPM to reach openpolyprint on the host network (host-mode)
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    openpolyprint_data:
    npm_data:
    npm_letsencrypt:
